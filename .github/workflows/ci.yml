name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate skill metadata and links
        run: node .github/scripts/check-skill.mjs
      - name: CLI help renders
        run: node scripts/circuitlab.mjs help | head -5
