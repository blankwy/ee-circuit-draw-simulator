<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="电子电路绘制仿真助手">
  <title>ee-circuit-draw-simulator</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e242c"/>
      <stop offset="1" stop-color="#04100f"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2fe3a8"/>
      <stop offset="1" stop-color="#5fe0ff"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.4" r="0.68">
      <stop offset="0" stop-color="#2fe3a8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2fe3a8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="badge">
      <rect width="512" height="512" rx="112"/>
    </clipPath>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g clip-path="url(#badge)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#halo)"/>

    <!-- 示波器式的刻度网格 -->
    <g stroke="#7cf7d4" stroke-opacity="0.07" stroke-width="1">
      <path d="M64 0V512M128 0V512M192 0V512M320 0V512M384 0V512M448 0V512"/>
      <path d="M0 64H512M0 128H512M0 192H512M0 320H512M0 384H512M0 448H512"/>
    </g>
    <g stroke="#7cf7d4" stroke-opacity="0.12" stroke-width="1">
      <path d="M256 0V512M0 256H512"/>
    </g>

    <!-- 主体：运放符号，输出端化成正弦波 -->
    <g filter="url(#glow)">
      <!-- 两个输入引脚 -->
      <path d="M80 174h52M80 338h52" fill="none" stroke="url(#glyph)" stroke-width="16" stroke-linecap="round"/>
      <!-- 运放三角形 -->
      <path d="M132 128L132 384L300 256Z" fill="#2fe3a8" fill-opacity="0.13"
            stroke="url(#glyph)" stroke-width="17" stroke-linejoin="round"/>
      <!-- 输出端的正弦波 -->
      <path d="M304 256C320 218 352 218 368 256S416 294 432 256" fill="none"
            stroke="url(#glyph)" stroke-width="16" stroke-linecap="round"/>
      <!-- 端点（原理图的连接点） -->
      <circle cx="80" cy="174" r="8" fill="#2fe3a8"/>
      <circle cx="80" cy="338" r="8" fill="#2fe3a8"/>
      <circle cx="432" cy="256" r="8" fill="#5fe0ff"/>
    </g>
  </g>
</svg>
